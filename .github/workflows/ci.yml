name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Release (GCC)
            cxx: g++
            flags: -DCMAKE_BUILD_TYPE=Release
          - name: Release (Clang)
            cxx: clang++
            flags: -DCMAKE_BUILD_TYPE=Release
          - name: Sanitizers (ASan + UBSan)
            cxx: clang++
            flags: -DCMAKE_BUILD_TYPE=Debug -DEXCHANGE_SANITIZE=ON
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} ${{ matrix.flags }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Latency smoke run
        if: matrix.name == 'Release (GCC)'
        run: ./build/latency 200000
